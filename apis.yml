aid: aegisai
name: AegisAI
description: >-
  AegisAI is an AI-native email security platform that deploys a network of
  autonomous AI agents to detect and stop advanced inbound email threats — spear
  phishing, business email compromise (BEC), zero-day phishing, malicious
  attachments, and QR-code attacks — before they reach the inbox. It integrates
  with Microsoft 365 and Google Workspace via API in about five minutes with no
  MX record changes, can run in monitoring mode, provides explainable incident
  response with Indicators of Compromise for CISOs, and reduces false positives
  by up to 90%. Founded by former Google Safe Browsing, reCAPTCHA, and Web Risk
  leaders Cy Khormaee (CEO) and Ryan Luo (CTO), AegisAI raised a $13M seed round
  co-led by Accel and Foundation Capital in 2025 and is SOC 2 Type II certified.
